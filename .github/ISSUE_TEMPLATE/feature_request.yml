name: Feature request
description: Suggest an improvement to MotionGlass.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe the use case or current difficulty.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Describe how the feature would work and any alternatives you considered.
    validations:
      required: true
